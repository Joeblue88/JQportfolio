.fw-emphasis.active>text[data-type-role="label"],.fw-emphasis.active>text[data-type-role="title"]{font-weight:700}

.career-year{font-weight:500}.career-body{font-weight:400}
.slide-foot button,#sceneCount,#buildCount{font-weight:400}

.is-english .copy .lead{font-size:22px;line-height:1.55}

.is-english .framework-wide .copy .lead{font-size:22px;line-height:1.5}
.fw-emphasis.active>text[data-type-role="small"]{font-weight:500}

body.is-english{font-family:'Manrope','Noto Sans SC',sans-serif;--type-heading-weight:800;--type-focus-weight:700}
.copy h1,.cover .copy h1,.closing .copy h1,.framework-wide .copy h1,.is-english .copy h1,.is-english .framework-wide .copy h1,.is-english .framework-wide .copy h1.title-compact{font-weight:var(--type-heading-weight)}
.copy .detail h2,.is-english .copy .detail h2,#profileCareer h3{font-weight:var(--type-focus-weight)}

.cover .copy .lead,.closing .copy .lead{font-weight:100}
.is-english .cover .copy .lead,.is-english .closing .copy .lead{font-weight:200}

.fw-emphasis.active>text[data-type-role="title"]{font-weight:var(--type-heading-weight)}

.is-english .cover .copy h1,.is-english .closing .copy h1{font-size:94px}

.material-symbol{display:inline-block;flex:none;fill:currentColor;stroke:none;vertical-align:middle}

.copy .detail h2.has-point-icon{display:flex;align-items:flex-start;gap:12px}
.copy .detail h2.has-point-icon>.material-symbol{margin-top:3px}
.copy .detail h2.has-point-icon>span{min-width:0;flex:1}
.fw-emphasis.active .material-icon{color:#f7f250}

/* Align the persona particle viewport to the center of its diagram plane. */
.persona-prelude #geometry,.persona-prelude #particleSpace,.persona-prelude #geometryLabels{left:648px!important;top:76.889px!important;width:872px!important;height:678.222px!important}

/* Large visual anchors: icon above the heading, left aligned with the copy. */
.copy .detail{top:450px;padding-top:24px;padding-bottom:24px}
.copy .detail h2.has-point-icon{flex-direction:column;align-items:flex-start;gap:12px}
.copy .detail h2.has-point-icon>.material-symbol{margin-top:0}
.copy .detail h2.has-point-icon>span{flex:none;width:100%}
.diagram-transition svg{width:100%;height:100%;display:block;overflow:hidden}

#geometry,#particleSpace{transform-origin:0 0}

/* Match every ordinary particle viewport to its black plane without stretching. */
.method-prelude:not(.shared-prelude) #geometry,.method-prelude:not(.shared-prelude) #particleSpace,.method-prelude:not(.shared-prelude) #geometryLabels,
.canvas-standard #geometry,.canvas-standard #particleSpace,.canvas-standard #geometryLabels{left:648px!important;top:76.889px!important;width:872px!important;height:678.222px!important}

/* Keep the teaching plane anchored to the ordinary diagram's lower edge (768px). */
.copy .detail{top:auto;bottom:132px}

/* Subtitles follow the actual title height instead of floating at mid-page. */
.copy .lead,.is-english .copy .lead{font-size:20px;line-height:1.5}
.cover .copy .lead,.closing .copy .lead,.is-english .cover .copy .lead,.is-english .closing .copy .lead{font-size:28px;line-height:1.5}
.framework-wide .copy .lead,.is-english .framework-wide .copy .lead{font-size:22px;line-height:1.5}

@media screen{
 body,#screen{background:var(--paper)}

 :fullscreen #screen{min-height:0}
 :fullscreen .toolbar{position:fixed;left:0;right:0;bottom:0;z-index:4;opacity:0;transition:opacity 180ms ease}
 :fullscreen .toolbar:hover,:fullscreen .toolbar:has(:focus-visible){opacity:1}
 :fullscreen #notesPanel{bottom:0}
}
@media screen and (hover:none){:fullscreen .toolbar{opacity:1}}

$('figureZoom').onclick=()=>{figureMagnified=!figureMagnified;$('figureFull').classList.toggle('magnified',figureMagnified);$('figureScroll').scrollTop=0;$('figureScroll').scrollLeft=0;$('figureZoom').textContent=figureMagnified?'100%':'200%'};
function notes(){stopAuto();$('notesPanel').hidden=!$('notesPanel').hidden;$('notes').setAttribute('aria-expanded',!$('notesPanel').hidden);$('practice').setAttribute('aria-expanded',!$('notesPanel').hidden);if(!$('notesPanel').hidden)renderNotes()}
function outline(){stopAll();renderOutline();$('outlineDialog').showModal();$('search').focus()}
function renderOutline(){const q=$('search').value.toLowerCase();$('outlineList').replaceChildren();let count=0;chapters.forEach((ch,c)=>{const group=document.createElement('section');group.className='outlineGroup';const h=document.createElement('h3');h.textContent=ch.title+' · '+ch.question;let subset=slides.map((s,i)=>({...s,i})).filter(s=>s.ch===c&&(s.title+' '+s.lead+' '+s.items.flat().join(' ')).toLowerCase().includes(q));if(!subset.length)return;group.append(h);subset.forEach(s=>{count++;let b=document.createElement('button');b.className='outlineRow'+(s.i===page?' active':'');b.innerHTML=`<span class="sceneNo">${String(s.i+1).padStart(2,'0')}</span><span class="name">${esc(s.title.replaceAll('\n',language==='en'?' ':''))}</span><span class="type">${s.update?(language==='en'?'Updated / added':'已更新 / 补充'):(language==='en'?'Source reconstructed':'原内容重构')}</span>`;b.onclick=()=>{$('outlineDialog').close();jump(s.i)};group.append(b)});$('outlineList').append(group)});if(!count)$('outlineList').textContent=(language==='en'?'No matches. Try “persona”, “experiment” or “service”.':'没有匹配内容，尝试“画像”“实验”“服务”等关键词。')}
function stopAuto(){clearInterval(auto);auto=null;$('play').textContent=language==='en'?'Auto play':'连续演绎';$('play').setAttribute('aria-pressed','false')}
function stopAll(){stopAuto()}
$('prev').onclick=()=>{stopAuto();prev()};$('next').onclick=()=>{stopAuto();next()};$('outline').onclick=outline;$('practice').onclick=()=>{stopAuto();$('notesPanel').hidden=false;renderNotes();$('notesPanel').scrollTop=0;$('notes').setAttribute('aria-expanded','true');$('practice').setAttribute('aria-expanded','true');};$('search').oninput=renderOutline;$('notes').onclick=notes;$('closeNotes').onclick=()=>{ $('notesPanel').hidden=true;$('notes').setAttribute('aria-expanded','false');$('practice').setAttribute('aria-expanded','false')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('play').onclick=()=>{if(auto){stopAll();return}auto=setInterval(next,4200);$('play').textContent=language==='en'?'Pause':'暂停演绎';$('play').setAttribute('aria-pressed','true')};$('motion').onclick=()=>{moving=!moving;if(!moving){surfaceTransition?.animations.forEach(a=>a.cancel());surfaceTransition?.ghost?.remove();surfaceTransition=null;transitions.forEach(({animation,ghost})=>{animation?.cancel();ghost?.remove()});transitions.clear()}document.body.classList.toggle('still',!moving);Geometry.setMotion(moving);visualState();$('motion').textContent=language==='en'?(moving?'Motion':'Still'):(moving?'动态':'静态');$('motion').setAttribute('aria-pressed',moving)};if(!moving){document.body.classList.add('still');$('motion').textContent=language==='en'?'Still':'静态';$('motion').setAttribute('aria-pressed','false')}
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent=language==='en'?'Use browser fullscreen':'请用浏览器全屏'}};
window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable=true]')||(e.key===' '&&e.target.closest('button,a,summary'))||e.metaKey||e.ctrlKey||e.altKey)return;if($('outlineDialog').open||$('figureDialog').open)return;switch(e.key.toLowerCase()){case 'arrowright':case ' ':case 'pagedown':e.preventDefault();stopAuto();if(e.shiftKey)jump(page+1);else next();break;case 'arrowleft':case 'pageup':e.preventDefault();stopAuto();if(e.shiftKey)jump(page-1);else prev();break;case 'o':outline();break;case 'n':notes();break;case 'f':$('fullscreen').click();break;case 'b':$('blackout').hidden=!$('blackout').hidden;break;case 'home':jump(0);break;case 'end':jump(slides.length-1);break;case 'escape':stopAuto();$('notesPanel').hidden=true;$('notes').setAttribute('aria-expanded','false');$('practice').setAttribute('aria-expanded','false');$('blackout').hidden=true;break;}});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(Number.isFinite(n))jump(n-1)});languageUI();chapterNav();function start(){let first=parseInt(location.hash.slice(1));show(Number.isFinite(first)?first-1:0)}(window.DECK_FONTS_READY||Promise.resolve()).then(start).catch(error=>{console.error('Embedded presentation fonts failed to load',error);start()});
})();

</script></body></html>
